name: Release RPK
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/ci-release.cjs metadata

      - name: Install locked dependencies
        run: npm ci

      - name: Test and generate preview
        run: |
          npm test
          npm run preview
          npm run preflight

      - name: Restore existing signing identity
        env:
          RPK_PRIVATE_KEY: ${{ secrets.RPK_PRIVATE_KEY }}
          RPK_CERTIFICATE: ${{ secrets.RPK_CERTIFICATE }}
        run: node scripts/ci-release.cjs sign

      - name: Build signed release
        run: |
          rm -rf dist build
          npm run release

      - name: Verify installable RPK and create checksum
        env:
          RPK_PATH: ${{ steps.metadata.outputs.rpk }}
          BUILD_STARTED_MS: ${{ steps.metadata.outputs.started_ms }}
        run: python3 scripts/verify-rpk.py "$RPK_PATH" --started-ms "$BUILD_STARTED_MS"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RPK_PATH: ${{ steps.metadata.outputs.rpk }}
          CHECKSUM_PATH: ${{ steps.metadata.outputs.checksum }}
        run: bash scripts/publish-release.sh

      - name: Remove runner signing files
        if: ${{ always() }}
        run: rm -rf sign
